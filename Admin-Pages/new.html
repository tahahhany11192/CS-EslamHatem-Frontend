<input type="file" id="videoFile" accept="video/*" />
<button onclick="uploadVideo()">Upload</button>
<progress id="progressBar" max="100" value="0"></progress>
<div id="status"></div>

<script>
const API_KEY = "c7d8f2e4-5a6b-4c9d-9e1f-123456789abc";
const WORKER_URL = "https://r2-upload-worker.cs-islamhatem.workers.dev";

async function uploadVideo() {
  const file = document.getElementById("videoFile").files[0];
  const progressBar = document.getElementById("progressBar");
  const status = document.getElementById("status");

  if (!file) return alert("Select a video");

  // Step 1: request pre-signed URL
  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-API-Key": API_KEY,
    },
    body: JSON.stringify({ filename: file.name, fileType: file.type, fileSize: file.size }),
  });

  if (!res.ok) {
    const text = await res.text();
    return alert("Upload failed: " + text);
  }

  const { url, key } = await res.json();

  // Step 2: upload in chunks
  const chunkSize = 10 * 1024 * 1024; // 10MB
  let uploaded = 0;

  for (let start = 0; start < file.size; start += chunkSize) {
    const end = Math.min(start + chunkSize, file.size);
    const chunk = file.slice(start, end);

    await fetch(url, { method: "PUT", body: chunk });
    uploaded += chunk.size;
    progressBar.value = (uploaded / file.size) * 100;
    status.textContent = `Uploading ${Math.round(progressBar.value)}%`;
  }

  status.textContent = "Upload complete ✔";
  console.log("R2 key:", key);
}
</script>
