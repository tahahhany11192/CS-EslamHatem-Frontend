<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .upload-box {
      background: #020617;
      padding: 25px;
      border-radius: 10px;
      width: 420px;
      box-shadow: 0 0 20px rgba(0,0,0,.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input[type=file] {
      width: 100%;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    button:disabled {
      background: #334155;
      cursor: not-allowed;
    }

    progress {
      width: 100%;
      height: 20px;
      margin-top: 15px;
    }

    .status {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="upload-box">
    <h2>Upload Video</h2>

    <input type="file" id="videoFile" accept="video/*" />

    <button id="uploadBtn" onclick="uploadVideo()">Upload</button>

    <progress id="progressBar" value="0" max="100"></progress>

    <div class="status" id="statusText"></div>
  </div>

  <script>
    const WORKER_URL = "https://r2-upload-worker.cs-islamhatem.workers.dev";

    function uploadVideo() {
      const fileInput = document.getElementById("videoFile");
      const file = fileInput.files[0];
      const progressBar = document.getElementById("progressBar");
      const statusText = document.getElementById("statusText");
      const uploadBtn = document.getElementById("uploadBtn");

      if (!file) {
        alert("Please select a video");
        return;
      }

      const formData = new FormData();
      formData.append("video", file);

      const xhr = new XMLHttpRequest();
      xhr.open("POST", WORKER_URL, true);

      uploadBtn.disabled = true;
      statusText.textContent = "Uploading...";

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const percent = (e.loaded / e.total) * 100;
          progressBar.value = percent;
          statusText.textContent = `Uploading ${Math.round(percent)}%`;
        }
      };

      xhr.onload = () => {
        uploadBtn.disabled = false;
        if (xhr.status === 200) {
          const res = JSON.parse(xhr.responseText);
          statusText.textContent = "Upload complete ✔";
          console.log("Uploaded file key:", res.key);
        } else {
          statusText.textContent = "Upload failed ❌";
        }
      };

      xhr.onerror = () => {
        uploadBtn.disabled = false;
        statusText.textContent = "Network error ❌";
      };

      xhr.send(formData);
    }
  </script>

</body>
</html>
