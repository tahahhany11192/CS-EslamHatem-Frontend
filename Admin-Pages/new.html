<input type="file" id="videoFile" accept="video/*">
<button onclick="uploadVideo()">Upload</button>
<progress id="progressBar" max="100" value="0"></progress>
<div id="status"></div>

<script>
const API_KEY = "c7d8f2e4-5a6b-4c9d-9e1f-123456789abc";
const WORKER_URL = "https://r2-upload-worker.cs-islamhatem.workers.dev";

async function uploadVideo() {
  const file = document.getElementById("videoFile").files[0];
  const status = document.getElementById("status");
  const progressBar = document.getElementById("progressBar");

  if (!file) return alert("Select a video");

  const chunkSize = 10 * 1024 * 1024; // 10MB
  const chunkCount = Math.ceil(file.size / chunkSize);

  // Step 1: Get pre-signed URLs for all chunks
  const resp = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
    body: JSON.stringify({
      filename: file.name,
      fileType: file.type,
      fileSize: file.size,
      chunkCount
    })
  });

  if (!resp.ok) {
    const text = await resp.text();
    return alert("Upload failed: " + text);
  }

  const { key, uploadId, urls } = await resp.json();

  // Step 2: Upload chunks
  for (let i = 0; i < urls.length; i++) {
    const start = i * chunkSize;
    const end = Math.min(start + chunkSize, file.size);
    const chunk = file.slice(start, end);

    await fetch(urls[i].url, { method: "PUT", body: chunk });

    progressBar.value = ((i + 1) / chunkCount) * 100;
    status.textContent = `Uploading ${Math.round(progressBar.value)}%`;
  }

  // Step 3: Complete multipart upload (optional, can be done in Worker or backend)
  status.textContent = "Upload complete ✔";
  console.log("R2 key:", key);
}
</script>
