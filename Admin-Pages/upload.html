<input type="text" id="videoName" placeholder="Enter video name">
<br><br>

<input type="file" id="videoFile" accept="video/*">
<br><br>

<button onclick="uploadVideo()">Upload Video</button>

<br><br>

<!-- Progress UI -->
<progress id="progressBar" max="100" value="0" style="width:300px;"></progress>
<div id="progressInfo"></div>
<div id="speedInfo"></div>
<div id="etaInfo"></div>

<script>
async function uploadVideo() {
    const file = document.getElementById("videoFile").files[0];
    const title = document.getElementById("videoName").value;

    if (!file) return alert("Please select a video file!");
    if (!title) return alert("Please enter a name for your video!");

    // 1️⃣ – Get presigned URL from backend
    const res = await fetch(`http://localhost:5000/api/r2/upload-url?filename=${file.name}&contentType=${file.type}`);
    const data = await res.json();

    const uploadUrl = data.uploadUrl;
    const finalUrl = data.fileUrl;

    let startTime = Date.now(); // Track upload time

    // 2️⃣ – Upload with progress tracking
    return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", uploadUrl);

        xhr.setRequestHeader("Content-Type", file.type);

        // PROGRESS handler
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percent = (e.loaded / e.total) * 100;
                document.getElementById("progressBar").value = percent;

                const mbUploaded = (e.loaded / (1024 * 1024)).toFixed(2);
                const mbTotal = (e.total / (1024 * 1024)).toFixed(2);

                document.getElementById("progressInfo").innerHTML = 
                    `Uploaded: ${mbUploaded} MB / ${mbTotal} MB (${percent.toFixed(2)}%)`;

                // Calculate speed
                const elapsed = (Date.now() - startTime) / 1000; // seconds
                const speed = (e.loaded / 1024 / 1024) / elapsed; // MB/s
                document.getElementById("speedInfo").innerHTML = 
                    `Speed: ${speed.toFixed(2)} MB/s`;

                // ETA
                const remainingMB = (e.total - e.loaded) / 1024 / 1024;
                const eta = remainingMB / speed;
                if (eta > 0) {
                    document.getElementById("etaInfo").innerHTML = 
                        `Estimated time left: ${eta.toFixed(1)} seconds`;
                }
            }
        };

        // UPLOAD COMPLETE
        xhr.onload = async function () {
            if (xhr.status === 200 || xhr.status === 204) {
                document.getElementById("etaInfo").innerHTML = "Upload complete! Saving...";

                // 3️⃣ – Save record in database
                const saveRes = await fetch(`http://localhost:5000/api/r2/save-video`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        title: title,
                        url: finalUrl,
                        size: file.size,
                        contentType: file.type
                    })
                });

                const saved = await saveRes.json();

                if (saved.success) {
                    alert("Video uploaded and saved successfully!");
                    resolve(saved.video);
                } else {
                    reject("Failed to save video in database");
                }
            } else {
                reject("Upload failed: HTTP " + xhr.status);
            }
        };

        // ERROR handler
        xhr.onerror = function () {
            reject("Upload error!");
        };

        // START UPLOAD
        xhr.send(file);
    });
}
</script>
